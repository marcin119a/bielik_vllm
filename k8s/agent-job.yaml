apiVersion: batch/v1
kind: Job
metadata:
  name: agent
  namespace: ai-agent
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: agent
          image: agent:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: agent-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: openai-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
