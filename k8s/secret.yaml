# kubectl create secret generic openai-secret \
#   --from-literal=openai-api-key='sk-...' \
#   -n ai-agent
#
# Lub zastąp REPLACE_ME i zastosuj: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: ai-agent
type: Opaque
stringData:
  openai-api-key: "REPLACE_ME"
